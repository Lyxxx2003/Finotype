name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: Feature description
      description: What would you like to see added or improved?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Problem / Motivation
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed solution
      description: How do you imagine this feature working?
    validations:
      required: false

  - type: textarea
    attributes:
      label: Alternatives considered
      description: Any alternative approaches?
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional context
      description: Screenshots, links, or extra details
    validations:
      required: false
